<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix ASCII Generator v1.0</title>
    <style>
        /* НОВАЯ ЦВЕТОВАЯ ПАЛИТРА (Фиолетово-синий неон) */
        :root {
            --bg-main: #0a0a10;
            --bg-panel: #151525;
            --bg-tab: #1e1e30;
            --bg-tab-active: #2a1a45;
            --accent: #8c52ff;
            --accent-hover: #a67cff;
            --accent-glow: rgba(140, 82, 255, 0.4);
            --text-main: #e0d4ff;
            --text-muted: #8e8e9c;
            --border: #331a66;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: #fff;
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Закругленные вкладки */
        .tabs { display: flex; gap: 8px; margin-bottom: 0; z-index: 2;}
        .tab-btn {
            background: var(--bg-tab); color: var(--text-muted); border: 1px solid var(--border);
            padding: 12px 24px; cursor: pointer; font-family: inherit; font-weight: 600;
            border-radius: 12px 12px 0 0; transition: all 0.3s ease;
            font-size: 15px;
        }
        .tab-btn:hover { background: #25253a; color: var(--text-main); }
        .tab-btn.active {
            background: var(--bg-tab-active); color: #fff; border-color: var(--accent);
            border-bottom: 1px solid transparent;
            box-shadow: 0 -4px 15px var(--accent-glow);
        }

        /* Округлые панели */
        .controls-container {
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 0 16px 16px 16px;
            padding: 25px; 
            margin-bottom: 25px; 
            width: 100%; 
            max-width: 950px; 
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tab-content { display: none; flex-wrap: wrap; gap: 25px; justify-content: center; align-items: flex-start; }
        .tab-content.active { display: flex; }

        /* Красивые контролы */
        label { 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            flex-direction: column; 
            text-align: center;
            font-weight: 500;
            color: var(--text-muted);
        }
        
        select, input[type="file"] { 
            font-family: inherit; 
            background: #0a0a14; 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px; 
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }
        select:focus, input[type="file"]:focus { border-color: var(--accent); }
        
        input[type="range"] { 
            accent-color: var(--accent); 
            width: 130px; 
            height: 6px;
            background: #0a0a14;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="color"] { 
            background: none; 
            border: 2px solid var(--border); 
            border-radius: 8px;
            cursor: pointer; 
            width: 40px; 
            height: 40px; 
            padding: 0; 
        }

        /* Кнопки с градиентом и свечением */
        .btn {
            background: linear-gradient(135deg, var(--accent), #5e17eb);
            color: #fff; 
            border: none; 
            padding: 12px 24px;
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 10px; 
            transition: all 0.3s ease;
            font-size: 16px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
            background: linear-gradient(135deg, var(--accent-hover), #7a2dff);
        }
        .btn-png { background: linear-gradient(135deg, #00e676, #00b0ff); box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4); color: #000;}
        .btn-copy { background: linear-gradient(135deg, #00b0ff, #8c52ff); }

        /* Контейнер превью */
        .output-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        
        .output-container {
            background: #050505; 
            border: 2px solid var(--border); 
            padding: 20px;
            border-radius: 20px; 
            overflow: auto; 
            max-width: 95vw; 
            max-height: 65vh;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
            display: flex; 
            justify-content: center; 
            align-items: center;
            transition: border-color 0.3s;
        }
        .output-container:hover { border-color: var(--accent); }

        /* Холст превью с плавным зумом */
        #previewCanvas {
            display: block;
            image-rendering: pixelated;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        #hiddenCanvas { display: none; }
        
        .value-display { 
            font-size: 13px; 
            color: var(--accent); 
            font-weight: bold;
            background: rgba(140, 82, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .toggle-label { 
            flex-direction: row; 
            cursor: pointer; 
            background: #1a1a2e; 
            padding: 10px 20px; 
            border-radius: 10px; 
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .toggle-label:hover { border-color: var(--accent); }
        .toggle-label input { accent-color: var(--accent); transform: scale(1.2); margin-right: 5px;}

        .warning-text { 
            color: #00b0ff; 
            font-size: 13px; 
            margin-bottom: 15px; 
            width: 100%; 
            text-align: center;
            background: rgba(0, 176, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 176, 255, 0.3);
        }
    </style>
</head>
<body>

    <h1>[ MATRIX ASCII v1.0 ]</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tab-img')">1. Картинка</button>
        <button class="tab-btn" onclick="openTab('tab-font')">2. Шрифт</button>
        <button class="tab-btn" onclick="openTab('tab-export')">3. Цвет и Экспорт</button>
    </div>

    <div class="controls-container">
        <!-- ВКЛАДКА 1: КАРТИНКА И ЗУМ -->
        <div class="tab-content active" id="tab-img">
            <label>Загрузить картинку <input type="file" id="imageLoader" accept="image/*"></label>
            <label>Режим
                <select id="modeSelect">
                    <option value="matrix">Matrix (Рандом)</option>
                    <option value="gradient">Градиент</option>
                </select>
            </label>
            <label>Символы
                <select id="charSet">
                    <option value="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789$#@%&*+=?">Катакана + Код</option>
                    <option value=" .:-=+*#%@$&!?01">Строгий ASCII</option>
                    <option value=" 01">Только 0 и 1</option>
                    <option value=" .,-~:;=!*#$@">Классика</option>
                </select>
            </label>
            <label>Ширина (символов)
                <input type="range" id="widthSlider" min="40" max="250" value="120">
                <span class="value-display" id="widthValue">120</span>
            </label>
            <label id="thresholdLabel">Плотность
                <input type="range" id="thresholdSlider" min="0.1" max="2.0" step="0.1" value="0.8">
                <span class="value-display" id="threshValue">0.8</span>
            </label>
            <label>Экспозиция (Яркость)
                <input type="range" id="brightnessSlider" min="0.5" max="3.0" step="0.1" value="1.2">
                <span class="value-display" id="brightnessValue">1.2</span>
            </label>
            
            <!-- ПЕРЕНЕСЕННЫЙ ПОЛЗУНОК ЗУМА -->
            <label>Масштаб превью
                <input type="range" id="previewZoomSlider" min="0.2" max="2.0" step="0.1" value="1.0">
                <span class="value-display" id="previewZoomValue">1.0x</span>
            </label>

            <label class="toggle-label" title="Заменяет пробелы на невидимые символы для сохранения формы текста">
                <input type="checkbox" id="invisibleSpaceCheckbox"> 
                Невидимый фон
            </label>
        </div>

        <!-- ВКЛАДКА 2: ШРИФТ -->
        <div class="tab-content" id="tab-font">
            <div class="warning-text">
                Настройки применяются к превью и PNG. Для текста копирования всегда используется стандартный шрифт.
            </div>
        
            <label>Загрузить .ttf / .otf <input type="file" id="fontLoader" accept=".ttf,.otf,.woff,.woff2"></label>
            
            <label>Жирность и стиль
                <select id="fontWeightSelect">
                    <option value="100 normal">Thin</option>
                    <option value="200 normal">Extra Light</option>
                    <option value="300 normal">Light</option>
                    <option value="400 normal" selected>Regular</option>
                    <option value="500 normal">Medium</option>
                    <option value="600 normal">Semi Bold</option>
                    <option value="700 normal">Bold</option>
                    <option value="800 normal">Extra Bold</option>
                    <option value="900 normal">Black</option>
                    <option value="100 italic">Thin Italic</option>
                    <option value="400 italic">Regular Italic</option>
                    <option value="700 italic">Bold Italic</option>
                </select>
            </label>

            <label>Пропорции букв (Высота)
                <input type="range" id="aspectRatioSlider" min="0.3" max="1.2" step="0.05" value="0.55">
                <span class="value-display" id="aspectValue">0.55</span>
            </label>
            <label>Масштаб шрифта в ячейке
                <input type="range" id="fontScaleSlider" min="0.5" max="1.5" step="0.05" value="1.0">
                <span class="value-display" id="fontScaleValue">1.0</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="forceGridCheckbox" checked> 
                Фиксировать по сетке
            </label>
        </div>

        <!-- ВКЛАДКА 3: ЦВЕТ И ЭКСПОРТ -->
        <div class="tab-content" id="tab-export">
            <label>Цвет текста <input type="color" id="colorPicker" value="#8c52ff"></label>
            <label>Цвет фона <input type="color" id="bgColorPicker" value="#050505"></label>
            
            <label>Формат файла
                <select id="formatSelect">
                    <option value="png">PNG (Без потерь)</option>
                    <option value="jpeg">JPEG (Сжатый)</option>
                    <option value="webp">WebP (Легкий)</option>
                </select>
            </label>

            <label>Разрешение (Масштаб)
                <select id="scaleSelect">
                    <option value="1">x1 (Базовое)</option>
                    <option value="2" selected>x2 (HD)</option>
                    <option value="3">x3 (2K)</option>
                    <option value="4">x4 (4K)</option>
                    <option value="5">x5 (Огромное)</option>
                </select>
            </label>
            
            <button class="btn btn-copy" id="copyBtn" style="display: none;">Копировать текст</button>
            <button class="btn btn-png" id="downloadBtn" style="display: none;">Скачать картинку</button>
        </div>
    </div>

    <!-- ОБЕРТКА ДЛЯ ПРЕВЬЮ -->
    <div class="output-wrapper">
        <div class="output-container" id="previewContainer">
            <canvas id="previewCanvas">Жду загрузки картинки...</canvas>
        </div>
    </div>

    <canvas id="hiddenCanvas"></canvas>

    <script>
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const imageLoader = document.getElementById('imageLoader');
        const fontLoader = document.getElementById('fontLoader');
        const previewCanvas = document.getElementById('previewCanvas');
        const pctx = previewCanvas.getContext('2d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hctx = hiddenCanvas.getContext('2d');
        
        const widthSlider = document.getElementById('widthSlider');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdLabel = document.getElementById('thresholdLabel');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const aspectRatioSlider = document.getElementById('aspectRatioSlider');
        const fontWeightSelect = document.getElementById('fontWeightSelect');
        const fontScaleSlider = document.getElementById('fontScaleSlider');
        const invisibleSpaceCheckbox = document.getElementById('invisibleSpaceCheckbox');
        const previewZoomSlider = document.getElementById('previewZoomSlider');
        
        const charSetSelect = document.getElementById('charSet');
        const modeSelect = document.getElementById('modeSelect');
        const colorPicker = document.getElementById('colorPicker');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImage = null;
        let currentAsciiStr = "";
        let currentFontFamily = "'Courier New', Courier, monospace";
        let currentWeight = "400";
        let currentStyle = "normal";

        // --- ОБРАБОТЧИКИ ИНТЕРФЕЙСА ---
        modeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'gradient') {
                thresholdSlider.disabled = true;
                thresholdSlider.style.opacity = '0.3';
                thresholdLabel.style.opacity = '0.3';
            } else {
                thresholdSlider.disabled = false;
                thresholdSlider.style.opacity = '1';
                thresholdLabel.style.opacity = '1';
            }
            if (currentImage) updateAll();
        });

        imageLoader.addEventListener('change', handleImage, false);
        
        fontLoader.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const fontName = 'CustomFont_' + Date.now();
            const fontUrl = URL.createObjectURL(file);
            const fontFace = new FontFace(fontName, `url(${fontUrl})`);
            try {
                await fontFace.load();
                document.fonts.add(fontFace);
                currentFontFamily = `"${fontName}", monospace`;
                if (currentImage) updateAll();
            } catch (err) {
                alert("Не удалось загрузить шрифт.");
            } finally {
                URL.revokeObjectURL(fontUrl);
            }
        });

        fontWeightSelect.addEventListener('change', (e) => {
            const [weight, style] = e.target.value.split(' ');
            currentWeight = weight;
            currentStyle = style;
            if (currentImage) updateAll();
        });

        // Пересчет при изменении любых настроек
        widthSlider.addEventListener('input', (e) => { document.getElementById('widthValue').innerText = e.target.value; if (currentImage) updateAll(); });
        thresholdSlider.addEventListener('input', (e) => { document.getElementById('threshValue').innerText = e.target.value; if (currentImage) updateAll(); });
        brightnessSlider.addEventListener('input', (e) => { document.getElementById('brightnessValue').innerText = e.target.value; if (currentImage) updateAll(); });
        aspectRatioSlider.addEventListener('input', (e) => { document.getElementById('aspectValue').innerText = e.target.value; if (currentImage) updateAll(); });
        fontScaleSlider.addEventListener('input', (e) => { document.getElementById('fontScaleValue').innerText = e.target.value; if (currentImage) updateAll(); });
        invisibleSpaceCheckbox.addEventListener('change', () => { if (currentImage) updateAll(); });
        charSetSelect.addEventListener('change', () => { if (currentImage) updateAll(); });
        colorPicker.addEventListener('input', () => { if (currentImage) updateAll(); });
        bgColorPicker.addEventListener('input', () => { if (currentImage) updateAll(); });

        // Логика зума (только для CSS превью, чтобы не перерисовывать холст)
        previewZoomSlider.addEventListener('input', (e) => {
            const zoom = parseFloat(e.target.value);
            document.getElementById('previewZoomValue').innerText = zoom.toFixed(1) + 'x';
            // Применяем CSS-трансформацию к холсту превью
            previewCanvas.style.transform = `scale(${zoom})`;
        });

        copyBtn.addEventListener('click', () => {
            if (!currentAsciiStr) return;
            navigator.clipboard.writeText(currentAsciiStr).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Скопировано! ✔";
                copyBtn.style.background = "#00e676";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.background = "linear-gradient(135deg, #00b0ff, #8c52ff)";
                }, 2000);
            });
        });

        // --- ГЕНЕРАЦИЯ ---
        function pseudoRandom(x, y) {
            let dot = x * 12.9898 + y * 78.233;
            let sin = Math.sin(dot) * 43758.5453;
            return sin - Math.floor(sin);
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    copyBtn.style.display = 'inline-block';
                    downloadBtn.style.display = 'inline-block';
                    updateAll();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function updateAll() {
            generateAscii();
            renderToCanvas(previewCanvas, pctx, 12, 1); 
        }

        function generateAscii() {
            if (!currentImage) return;

            const asciiChars = charSetSelect.value;
            const mode = modeSelect.value;
            const width = parseInt(widthSlider.value);
            const threshold = parseFloat(thresholdSlider.value);
            const brightnessMod = parseFloat(brightnessSlider.value);
            const aspect = parseFloat(aspectRatioSlider.value);
            const height = Math.floor((currentImage.height / currentImage.width) * width * aspect);
            const emptyChar = invisibleSpaceCheckbox.checked ? "\u2800" : " ";

            hiddenCanvas.width = width;
            hiddenCanvas.height = height;
            hctx.clearRect(0, 0, width, height);
            hctx.drawImage(currentImage, 0, 0, width, height);

            const imageData = hctx.getImageData(0, 0, width, height);
            const pixels = imageData.data;
            
            let asciiStr = "";

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const offset = (y * width + x) * 4;
                    const r = pixels[offset], g = pixels[offset + 1], b = pixels[offset + 2];
                    
                    let brightness = (0.299 * r + 0.587 * g + 0.114 * b) * brightnessMod;
                    if (brightness > 255) brightness = 255; 
                    let normalized = brightness / 255;

                    if (normalized < 0.05) {
                        asciiStr += emptyChar; 
                        continue;
                    }

                    if (mode === "matrix") {
                        let randVal = pseudoRandom(x, y);
                        let probability = normalized * threshold; 
                        if (randVal < probability) {
                            let charIndex = Math.floor(pseudoRandom(y, x) * asciiChars.length);
                            asciiStr += asciiChars[charIndex];
                        } else {
                            asciiStr += emptyChar; 
                        }
                    } else {
                        const charIndex = Math.floor(normalized * (asciiChars.length - 1));
                        asciiStr += asciiChars[charIndex];
                    }
                }
                asciiStr += "\n";
            }

            currentAsciiStr = asciiStr;
        }

        // --- УНИВЕРСАЛЬНЫЙ РЕНДЕР ---
        function renderToCanvas(canvas, ctx, baseSize, multiplier) {
            if (!currentAsciiStr) return;

            const lines = currentAsciiStr.split('\n');
            const numLines = lines.length;
            const maxChars = Math.max(...lines.map(l => l.length));

            const finalFontSize = baseSize * multiplier;
            const padding = 20 * multiplier; 
            
            const forceGrid = document.getElementById('forceGridCheckbox').checked;
            const fontScaleMult = parseFloat(document.getElementById('fontScaleSlider').value);

            const cellWidth = finalFontSize * 0.6; 
            const cellHeight = finalFontSize;

            canvas.width = Math.ceil(maxChars * cellWidth) + (padding * 2);
            canvas.height = numLines * cellHeight + (padding * 2);

            ctx.fillStyle = bgColorPicker.value; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const drawSize = finalFontSize * fontScaleMult;
            ctx.font = `${currentStyle} ${currentWeight} ${drawSize}px ${currentFontFamily}`;
            ctx.fillStyle = colorPicker.value;
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numLines; i++) {
                let line = lines[i];
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    
                    if (char === " " || char === "\u2800") continue;

                    const xPos = padding + (j * cellWidth) + (cellWidth / 2);
                    const yPos = padding + (i * cellHeight) + (cellHeight / 2);

                    if (forceGrid) {
                        const charWidth = ctx.measureText(char).width;
                        const scaleX = Math.min(cellWidth / (charWidth || cellWidth), 1.0);

                        ctx.save();
                        ctx.translate(xPos, yPos);
                        ctx.scale(scaleX, 1); 
                        ctx.fillText(char, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(char, xPos, yPos);
                    }
                }
            }
        }

        // --- ЭКСПОРТ В ВЫСОКОМ КАЧЕСТВЕ ---
        downloadBtn.addEventListener('click', () => {
            if (!currentAsciiStr) return;

            const multiplier = parseInt(document.getElementById('scaleSelect').value);
            const dlCanvas = document.createElement('canvas');
            const dlCtx = dlCanvas.getContext('2d');
            
            // Базовый размер 20px * выбранный множитель (x1, x2...)
            renderToCanvas(dlCanvas, dlCtx, 20, multiplier);

            const format = document.getElementById('formatSelect').value;
            const mimeType = `image/${format}`;
            const quality = (format === 'png') ? undefined : 0.95;
            const dataURL = dlCanvas.toDataURL(mimeType, quality);

            const link = document.createElement('a');
            link.download = `matrix-art-v1.0-${multiplier}x.${format}`;
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
